name: manufacturing-rl
services:
  postgres:
    image: postgres:16-alpine
    user: '70:70'
    environment:
      POSTGRES_DB: manufacturing_rl
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo_local_only
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./postgres/02-phase1.sql:/docker-entrypoint-initdb.d/02-phase1.sql:ro
      - ./postgres/03-research.sql:/docker-entrypoint-initdb.d/03-research.sql:ro
      - ./postgres/04-grafana.sql:/docker-entrypoint-initdb.d/04-grafana.sql:ro
    tmpfs:
      - /var/lib/postgresql/data:rw,size=1073741824,uid=70,gid=70,mode=0700
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U demo -d manufacturing_rl']
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 120s
  grafana:
    image: grafana/grafana:11.6.0
    user: '0'
    ports: ['127.0.0.1:3000:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin_local_only
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: demo
      GF_DATABASE_PASSWORD: demo_local_only
      GF_DATABASE_SSL_MODE: disable
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./grafana/provisioning/datasources/postgres.yml:/etc/grafana/provisioning/datasources/postgres.yml:ro
      - ./grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana/dashboards/mk01_baselines.json:/etc/grafana/research-dashboards/mk01_baselines.json:ro
      - ./grafana/dashboards/research-benchmark.json:/etc/grafana/research-dashboards/research-benchmark.json:ro
      - ./grafana/dashboards/research-overview.json:/etc/grafana/research-dashboards/research-overview.json:ro
      - ./grafana/dashboards/research-scheduler.json:/etc/grafana/research-dashboards/research-scheduler.json:ro
      - ./grafana/dashboards/research-training.json:/etc/grafana/research-dashboards/research-training.json:ro
      - ./grafana/dashboards/research-extended.json:/etc/grafana/research-dashboards/research-extended.json:ro
      - ./grafana/dashboards/research-multi-rl.json:/etc/grafana/research-dashboards/research-multi-rl.json:ro
  prometheus:
    image: prom/prometheus:v3.0.1
    user: '0'
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./runtime/prometheus:/prometheus
